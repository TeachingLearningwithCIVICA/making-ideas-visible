  --s6-bg:#fbeaf0; --s6-edge:#993556; --s6-fg:#6b1f3a;
  --s7-bg:#fcebeb; --s7-edge:#A32D2D; --s7-fg:#6e1a1a;
}

[data-theme="dark"]{
  --civica-mark:#86acda;
  --civica-rule:rgba(134,172,218,.26);
  --bg:#14131c;
  --surface:#1d1c28;
  --ink:#ECEBF5;
  --muted:#B4B3C8;
  --hint:#A9A8BE;

*, *::before, *::after{ box-sizing:border-box; }

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-display);
  font-size:17px;
  line-height:1.6;

  transition:background .4s ease, color .4s ease;
}

a{ color:var(--accent); }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible, summary:focus-visible{
  outline:3px solid var(--focus); outline-offset:2px; border-radius:3px;
}

.page{ max-width:820px; margin:0 auto; padding:2rem 1.5rem 5rem; }

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* ---------- CIVICA chrome ---------- */
.skip-link{
  position:absolute; left:12px; top:-4rem; z-index:100;
  background:var(--civica-mark); color:#fff;
  font-family:var(--font-display); font-weight:700; font-size:15px;
  padding:11px 18px; border-radius:10px; text-decoration:none;
  transition:top .2s ease;
}
[data-theme="dark"] .skip-link{ color:#141311; }
.skip-link:focus{ top:12px; }

.civica-bar{ border-bottom:1px solid var(--line); }
.civica-bar > div{
  max-width:820px; margin:0 auto; padding:14px 1.5rem;
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.civica-mark{ display:flex; flex-direction:column; gap:2px; text-decoration:none; line-height:1; }
/* PLACEHOLDER WORDMARK — swap for the official transparent CIVICA SVG when available. */
.civica-wordmark{
  font-family:var(--font-display); font-weight:900; font-size:18px;
  letter-spacing:.06em; color:var(--civica-mark);
}
.civica-sub{
  font-family:var(--font-display); font-weight:600; font-size:12px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
}
.ctl{
  font-family:var(--font-display); font-size:14px; font-weight:700; letter-spacing:.03em;
  background:transparent; color:var(--ink);
  border:1.5px solid var(--line); border-radius:999px;
  padding:9px 15px; cursor:pointer; line-height:1;
}
.ctl:hover{ border-color:var(--accent); color:var(--accent); }
.ctl[aria-pressed="true"][data-lang]{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
.ctl-theme{ display:flex; align-items:center; gap:7px; padding-left:12px; }
.ctl-theme svg{ width:15px; height:15px; flex-shrink:0; }
.control-group{ display:flex; gap:.6rem; align-items:center; }
.lang-group{ display:flex; gap:.3rem; }

/* ---------- Header ---------- */
header{ margin-bottom:1.75rem; }
h1{ font-family:var(--font-display); font-weight:900;
    font-size:clamp(2rem,4.5vw,2.6rem); line-height:1.1; margin:0 0 1rem; color:var(--ink); }
.lede{ font-size:1.1rem; color:var(--muted); line-height:1.75; max-width:640px; margin:0; }
.lede + .lede{ margin-top:.9rem; }
.hint{ font-size:.95rem; color:var(--hint); text-align:center; margin:0 0 1rem; }

/* ---------- Mind map ----------
   Always a mind map. Two layouts of the same map:
   - narrow screens: a portrait map, hub in the middle, strategies in two
     columns branching off a central trunk;
   - wider screens (520px+): the author's original radial map.
   Real HTML buttons sit on top of an SVG connector layer in both. */
.diagram-wrap{
  position:relative;
  aspect-ratio:340 / 540;
  container-type:inline-size;
}
.connectors{ position:absolute; inset:0; width:100%; height:100%; }
.connectors line, .connectors path{ stroke:var(--connector); }
.connectors-wide{ display:none; }
.connectors-narrow{ display:block; }

.hub{
  display:flex; align-items:center; justify-content:center; text-align:center;
  position:absolute; left:20%; top:50%; width:60%; min-height:10%;
  transform:translateY(-50%);
  background:var(--hub-fill); border:1.5px solid var(--hub-edge); border-radius:12px;
  color:var(--hub-ink); font-weight:700; line-height:1.2; padding:6px 10px;
  font-size:15px;
}

.vnode-btn{
  position:absolute; width:42%; min-height:11%;
  transform:translateY(-50%);
  display:flex; flex-direction:row; align-items:center; justify-content:flex-start;
  gap:6px; text-align:left;
  border-radius:8px;
  border:1px solid var(--edge);
  background:var(--fill);
  color:var(--label);
  font-family:inherit; font-weight:700; font-size:13px; line-height:1.25;
  cursor:pointer; padding:6px 8px;
  transition:box-shadow .15s ease;
}
.vnode-icon{ flex-shrink:0; width:18px; height:18px; color:var(--edge); }
.vnode-label{ flex:1; min-width:0; hyphens:auto; overflow-wrap:break-word; }
.vnode-btn:hover{ box-shadow:0 2px 10px var(--shadow-hover); }
.vnode-btn[aria-expanded="true"]{ box-shadow:0 0 0 2px var(--pressed-ring) inset; }

.s0{ --fill:var(--s0-bg); --edge:var(--s0-edge); --label:var(--s0-fg); }
.s1{ --fill:var(--s1-bg); --edge:var(--s1-edge); --label:var(--s1-fg); }
.s2{ --fill:var(--s2-bg); --edge:var(--s2-edge); --label:var(--s2-fg); }
.s3{ --fill:var(--s3-bg); --edge:var(--s3-edge); --label:var(--s3-fg); }
.s4{ --fill:var(--s4-bg); --edge:var(--s4-edge); --label:var(--s4-fg); }
.s5{ --fill:var(--s5-bg); --edge:var(--s5-edge); --label:var(--s5-fg); }
.s6{ --fill:var(--s6-bg); --edge:var(--s6-edge); --label:var(--s6-fg); }
.s7{ --fill:var(--s7-bg); --edge:var(--s7-edge); --label:var(--s7-fg); }

/* Portrait positions: left edge, vertical centre (as % of the 340 × 540 map) */
.q-1l{ left:4%;  top:10%; }  .q-1r{ left:54%; top:10%; }
.q-2l{ left:4%;  top:30%; }  .q-2r{ left:54%; top:30%; }
.q-4l{ left:4%;  top:70%; }  .q-4r{ left:54%; top:70%; }
.q-5l{ left:4%;  top:90%; }  .q-5r{ left:54%; top:90%; }

@media (max-width:519px){
  .page{ padding-left:1rem; padding-right:1rem; }
}

@media (min-width:520px){
  .diagram-wrap{ aspect-ratio:680 / 490; }
  .connectors-wide{ display:block; }
  .connectors-narrow{ display:none; }
  .hub{ left:35.29%; top:48.575%; width:29.41%; min-height:11.43%; padding:4px 8px;
        font-size:clamp(12px, 2.1cqw, 15px); }
  .vnode-btn{
    width:27.06%; min-height:11.43%;
    justify-content:center; gap:8px; padding:6px 10px;
    font-size:clamp(12px, 2.1cqw, 14px);
  }
  .vnode-icon{ width:clamp(18px, 3.4cqw, 24px); height:clamp(18px, 3.4cqw, 24px); }
  /* Positions: left edge, vertical centre (as % of the 680 × 490 map) */
  .p-tl{ left:5.88%;  top:17.955%; }
  .p-tc{ left:36.47%; top:17.955%; }
  .p-tr{ left:67.06%; top:17.955%; }
  .p-ml{ left:2.94%;  top:50.615%; }
  .p-mr{ left:70.00%; top:50.615%; }
  .p-bl{ left:5.88%;  top:82.245%; }
  .p-bc{ left:36.47%; top:82.245%; }
  .p-br{ left:67.06%; top:82.245%; }
}

/* ---------- Detail panel ---------- */
.detail-panel{
  position:relative;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:1.25rem 1.5rem;
  margin-top:1.5rem;
  gap:1.5rem;
  align-items:flex-start;
  box-shadow:0 2px 12px var(--shadow);
}
.detail-panel:not([hidden]){ display:flex; }
.panel-close{
  position:absolute; top:.75rem; right:.75rem;
  width:32px; height:32px; border-radius:50%;
  border:1px solid var(--line); background:var(--surface); color:var(--close-ink);
  font-size:1.2rem; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.panel-close:hover{ background:var(--close-hover); }
.detail-img{
  flex-shrink:0; width:226px;
  background:var(--illus-tile); border-radius:10px; padding:8px;
}
.detail-img svg{ width:210px; height:180px; display:block; }
.detail-text{ padding-right:2rem; }
.detail-text h2{ font-size:1.1rem; font-weight:700; color:var(--panel-title); margin:0 0 .6rem; line-height:1.35; }
.detail-text ul{ padding-left:1.2rem; margin:0; }
.detail-text li{ font-size:1rem; line-height:1.7; color:var(--tip-ink); margin-bottom:.3rem; }

@media (max-width:600px){
  .detail-panel:not([hidden]){ flex-direction:column; padding-top:3rem; }
  .detail-img{ width:100%; max-width:340px; }
  .detail-img svg{ width:100%; height:auto; }
  .detail-text{ padding-right:0; }
}

/* ---------- Footer + CIVICA attribution ---------- */
footer{ margin-top:3rem; border-top:1.5px solid var(--civica-rule); padding-top:1.4rem; }
.attribution{
  display:grid; gap:.45rem; font-size:14px; max-width:64ch;
}
.attr-line{ display:flex; flex-wrap:wrap; align-items:baseline; gap:.2rem .55rem; margin:0; }
.attr-label{
  font-family:var(--font-display); font-weight:900; font-size:12px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--civica-mark);
  flex:0 0 7.5rem;
}
.attr-value{ flex:1 1 20rem; }
.attribution a{ color:var(--ink); text-decoration-color:var(--civica-rule); text-underline-offset:3px; }
.attr-role{ color:var(--muted); font-size:13px; }
.attr-funding{ margin:.5rem 0 0; font-size:13px; color:var(--muted); }

@media (max-width:600px){
  .attr-label{ flex:1 0 100%; }
  .civica-sub{ display:none; }
}
@media print{
  .civica-bar, .skip-link, .hint{ display:none !important; }
  body{ background:#fff; color:#000; }
}
</style>

/* ===== State ===== */
let lang = "en";
let openIndex = -1;
let lastFocused = null;
const L = () => LANGS[lang];
const panel = $("panel");
const panelTitle = $("panel-title");
const nodes = Array.from(document.querySelectorAll(".vnode-btn"));

function renderPanel(i){
  const s = L().strategies[i];
  panelTitle.textContent = s.title;
  $("panel-list").innerHTML = s.tips.map(t => `<li>${esc(t)}</li>`).join("");
  $("panel-svg").innerHTML = illustrations[i](L().svg);
}

function show(i, triggerEl){
  lastFocused = triggerEl;
  openIndex = i;
  renderPanel(i);
  panel.hidden = false;
  nodes.forEach(b => b.setAttribute("aria-expanded", String(b === triggerEl)));
  panelTitle.focus();
}

function closePanel(){
  panel.hidden = true;
  openIndex = -1;
  nodes.forEach(b => b.setAttribute("aria-expanded", "false"));
  if (lastFocused) lastFocused.focus();
}

nodes.forEach(btn => btn.addEventListener("click", () => show(Number(btn.dataset.i), btn)));
$("panel-close").addEventListener("click", closePanel);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !panel.hidden) closePanel();
});

/* ===== Language ===== */
function applyLanguage(code){
  lang = code;
  const T = LANGS[code];
  document.documentElement.lang = LOCALES[code];
  document.title = T.docTitle;

  $("t-skip").textContent = T.skip;
  $("t-mark").setAttribute("aria-label", T.markLabel);
  $("t-mark-sub").textContent = T.markSub;
  $("lang-group").setAttribute("aria-label", T.langGroup);
  $("t-title").textContent = T.title;
  $("t-lede").textContent = T.lede;
  $("t-lede2").textContent = T.lede2;
  $("diagram-hint").textContent = T.hint;
  $("t-hub").textContent = T.hub;
  $("panel-close").setAttribute("aria-label", T.close);
  $("t-lbl-author").textContent = T.lblAuthor;
  $("t-lbl-published").textContent = T.lblPublished;
  $("t-lbl-licence").textContent = T.lblLicence;
  $("t-licence-text").textContent = T.licenceText;
  $("t-lbl-part").textContent = T.lblPart;
  $("t-funding").textContent = T.funding;
  document.querySelectorAll(".t-newtab").forEach(el => el.textContent = T.newTab);

  nodes.forEach(btn => {
    btn.querySelector(".vnode-label").textContent = T.strategies[Number(btn.dataset.i)].label;
  });
  if (openIndex >= 0) renderPanel(openIndex);

  if (PUBLISHED){
    const el = $("published-date");
    el.setAttribute("datetime", PUBLISHED);
    el.textContent = new Intl.DateTimeFormat(LOCALES[code], {
      day:"numeric", month:"long", year:"numeric"
    }).format(new Date(PUBLISHED + "T12:00:00Z"));
    $("published-line").hidden = false;
  }

  document.querySelectorAll("[data-lang]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === code)));

  updateThemeButton();
}

/* ===== Theme ===== */
const SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.8v2.4M12 19.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>`;
const MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1z"/></svg>`;

function updateThemeButton(){
  const dark = document.documentElement.dataset.theme === "dark";
  $("theme-icon").innerHTML = dark ? SUN : MOON;
  $("theme-label").textContent = dark ? L().themeToLight : L().themeToDark;
  $("theme-btn").setAttribute("aria-pressed", String(dark));
  $("theme-btn").setAttribute("aria-label", dark ? L().themeToLightLabel : L().themeToDarkLabel);
}

$("theme-btn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  updateThemeButton();
});

document.querySelectorAll("[data-lang]").forEach(b =>
  b.addEventListener("click", () => applyLanguage(b.dataset.lang)));

if (typeof window.matchMedia === "function" &&
    window.matchMedia("(prefers-color-scheme: dark)").matches){
  document.documentElement.dataset.theme = "dark";
}

applyLanguage("en");
</script>
